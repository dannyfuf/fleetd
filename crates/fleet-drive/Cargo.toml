[package]
name = "fleet-drive"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["legacy", "socket"]
# The lazygit driver's own file-script transport (`legacy`), which `fleet-lazygit` is the only
# consumer of.
legacy = []
# The harness command socket: the protocol, the server loop, input dispatch and the predicate
# evaluator. `socket` implies `legacy` because `input` shares its keystroke translation.
socket = ["legacy"]

[dependencies]
anyhow.workspace = true
async-channel.workspace = true
gpui.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
# `tokio::select!` in the legacy driver is the whole use; no runtime, no channels.
tokio = { workspace = true, features = ["macros"] }
tracing.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
