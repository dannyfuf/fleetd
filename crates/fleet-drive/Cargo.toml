[package]
name = "fleet-drive"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

# No `default` list, on purpose: `cargo build --workspace` would switch `default` on while
# `cargo build -p fleet-app` (dependents name `default-features = false`) would not, and that
# one flag forks fleet-drive, fleet-lazygit, fleet-harness and fleet-app into two builds each.
# Dependents name the half they link; this crate's own tests take `socket` below.
[features]
# The lazygit driver's own file-script transport (`legacy`), which `fleet-lazygit` is the only
# consumer of.
legacy = []
# The harness command socket: the protocol, the server loop, input dispatch and the predicate
# evaluator. `socket` implies `legacy` because `input` shares its keystroke translation.
socket = ["legacy"]

[dependencies]
anyhow.workspace = true
async-channel.workspace = true
gpui.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
# `tokio::select!` in the legacy driver is the whole use; no runtime, no channels.
tokio = { workspace = true, features = ["macros"] }
tracing.workspace = true

[dev-dependencies]
fleet-drive = { workspace = true, features = ["socket"] }
gpui = { workspace = true, features = ["test-support"] }
