[package]
name = "fleet-daemon"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
# One integration-test binary, `tests/integration.rs`, instead of one per file.
autotests = false

[lints]
workspace = true

[[bin]]
name = "fleetd"
path = "src/main.rs"

[features]
# The deterministic fakes in `testing`, used by this crate's own tests and by the workspace
# crates that drive a daemon without spawning one. Never in the default set.
test-support = []
# Opt-in tests that spawn the **real** `claude` and `codex` binaries. The default `make test`
# run spawns neither: every other agent test drives a scripted `/bin/sh` mock peer, so a machine
# with no harness installed — CI included — still runs the whole suite.
real-agents = []

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
clap.workspace = true
fleet-core.workspace = true
fleet-proto.workspace = true
fleet-term.workspace = true
futures-util = { workspace = true, features = ["sink"] }
libc.workspace = true
regex.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
shell-words.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { workspace = true, features = ["codec", "rt"] }
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
uuid.workspace = true

[dev-dependencies]
# The end-to-end suites talk to their private `fleetd` the way every other peer does,
# over the typed client, rather than through a second hand-rolled socket helper.
fleet-client.workspace = true
fleet-daemon = { workspace = true, features = ["test-support"] }
# The end-to-end automation suite boots a private `fleetd` and a scripted provider.
# No cycle: `fleet-harness` depends on `fleet-client`, `fleet-core`, `fleet-drive` and
# `fleet-proto` only.
fleet-harness.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[[test]]
name = "integration"
path = "tests/integration.rs"
