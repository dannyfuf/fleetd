[workspace]
resolver = "3"
members = [
    "crates/fleet-core",
    "crates/fleet-git",
    "crates/fleet-proto",
    "crates/fleet-term",
    "crates/fleet-daemon",
    "crates/fleet-client",
    "crates/fleet-ui-kit",
    "crates/fleet-cli",
    "crates/fleet-app",
    "crates/fleet-lazygit",
    "crates/fleet-drive",
    "crates/fleet-harness",
]

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
publish = false

# Hazards only. Clippy's default `style`, `complexity`, `perf` and `correctness`
# groups stay at warn and are enforced by `-D warnings` in `make clippy`, so this
# list never grants an allowance — it only raises what a warning would let slip.
[workspace.lints.clippy]
dbg_macro = "deny"
declare_interior_mutable_const = "deny"
disallowed_methods = "deny"
todo = "deny"
unimplemented = "deny"
# `redundant_clone` belongs here too, but the app and lazygit render paths still
# trip it. Add it once `cargo clippy --workspace --all-targets --all-features --
# -W clippy::redundant_clone` is quiet.

[workspace.dependencies]
fleet-cli = { path = "crates/fleet-cli" }
fleet-client = { path = "crates/fleet-client" }
fleet-core = { path = "crates/fleet-core" }
fleet-daemon = { path = "crates/fleet-daemon" }
# `default-features = false` here so each member names the half it links: `fleet-lazygit` takes
# `legacy` alone, and only the crates that speak the harness socket pull `socket` in with the
# predicate evaluator and `regex` behind it.
fleet-drive = { path = "crates/fleet-drive", default-features = false }
fleet-git = { path = "crates/fleet-git" }
fleet-harness = { path = "crates/fleet-harness" }
fleet-lazygit = { path = "crates/fleet-lazygit" }
fleet-proto = { path = "crates/fleet-proto" }
fleet-term = { path = "crates/fleet-term" }
fleet-ui-kit = { path = "crates/fleet-ui-kit" }

anyhow = "1"
async-channel = "2"
async-trait = "0.1"
base64 = "0.22"
bitflags = "2"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
gpui = { git = "https://github.com/zed-industries/zed", tag = "v1.18.1", default-features = false }
# `gpui_platform` and `gpui_linux` are both declared `default-features = false` upstream, so a
# consumer that names no backend gets a binary with no Wayland or X11 code in it at all and
# `gpui::guess_compositor()` answers "Headless" on every Linux desktop. Fleet is a desktop
# app; both Linux backends are part of the product.
gpui_platform = { git = "https://github.com/zed-industries/zed", tag = "v1.18.1", features = [
    "font-kit",
    "wayland",
    "x11",
] }
libc = "0.2"
libghostty-vt = "=0.2.1"
nix = { version = "0.28", features = ["process", "signal"] }
notify = "8"
portable-pty = "0.9.0"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rusqlite = { version = "0.37", features = ["bundled", "serde_json", "chrono", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = { version = "1", features = ["serde"] }
sha2 = "0.10"
shell-words = "1"
similar = "3.2"
smol_str = "0.3"
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", default-features = false }
tokio-util = "0.7"
tracing = "0.1"
tracing-appender = "0.2"
log = "0.4"
tracing-subscriber = "0.3"
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
unicode-segmentation = "1"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4", "v5", "serde"] }

# Zed's shape (docs/decisions/0001-gpui-and-toolchain.md): dependencies build unoptimized and
# only the ones GPUI spends its frames in are optimized. Optimizing all ~800 of them cost more
# than twice the cold build time and pushed a 16 GB machine into swap. "limited" debuginfo
# keeps backtraces and breakpoints on functions but drops per-variable info, which shrinks the
# app's incremental rebuild and every test binary.
[profile.dev]
opt-level = 1
debug = "limited"
split-debuginfo = "unpacked"

# Build scripts and proc-macros get the same settings as ordinary dependencies, so a crate that
# is both (serde, syn, libc…) compiles once rather than once per profile.
[profile.dev.build-override]
opt-level = 0
debug = false

[profile.dev.package."*"]
opt-level = 0
debug = false

# Bundled SQLite is C compiled by the build script at this opt-level; -O1 halves its compile
# time against -O3 and the daemon's queries are not hot.
[profile.dev.package.libsqlite3-sys]
opt-level = 1

# The hot dependencies, optimized even in dev. Unoptimized they make the app sluggish:
# layout (taffy), text shaping and font parsing, SVG icons, image decoding, the renderer,
# syntax highlighting, JSON on the wire, and the proc-macros every build runs.
[profile.dev.package]
taffy = { opt-level = 3 }
cosmic-text = { opt-level = 3 }
swash = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
harfrust = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
skrifa = { opt-level = 3 }
read-fonts = { opt-level = 3 }
zeno = { opt-level = 3 }
etagere = { opt-level = 3 }
resvg = { opt-level = 3 }
usvg = { opt-level = 3 }
tiny-skia = { opt-level = 3 }
lyon_tessellation = { opt-level = 3 }
image = { opt-level = 3 }
png = { opt-level = 3 }
zune-jpeg = { opt-level = 3 }
fdeflate = { opt-level = 3 }
miniz_oxide = { opt-level = 3 }
wgpu-core = { opt-level = 3 }
wgpu-hal = { opt-level = 3 }
naga = { opt-level = 3 }
syntect = { opt-level = 3 }
fancy-regex = { opt-level = 3 }
regex-automata = { opt-level = 3 }
regex-syntax = { opt-level = 3 }
memchr = { opt-level = 3 }
hashbrown = { opt-level = 3 }
serde_json = { opt-level = 3 }
sha2 = { opt-level = 3 }
proc-macro2 = { opt-level = 3 }
quote = { opt-level = 3 }
syn = { opt-level = 3 }
serde_derive = { opt-level = 3 }
gpui_macros = { opt-level = 3 }
